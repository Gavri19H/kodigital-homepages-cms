name: CI / Deploy

# CI runs on every pull_request targeting main and on every push to main.
# Staging deploy: optional, runs on push to main when the repo variable
# ENABLE_STAGING_DEPLOY is the literal string 'true'.
# Production deploy: workflow_dispatch ONLY — the operator must trigger
# the workflow manually from the Actions tab (or `gh workflow run`) after
# staging smoke passes. Auto-production-deploy is intentionally absent;
# every prod deploy requires a human click. See
# docs/deployment-runbook.md "Flight — Production".
#
# Cloudflare deploy credentials are GitHub Actions secrets (NOT Worker
# runtime secrets — see docs/secrets-manifest.md for the per-surface
# secret contract):
#   - CLOUDFLARE_API_TOKEN   : scoped to Workers Scripts:Edit on this
#                              project's Workers; set per
#                              docs/github-secrets-setup.md.
#   - CLOUDFLARE_ACCOUNT_ID  : kodigital Cloudflare account id; passed
#                              to wrangler at deploy time.
# The Worker runtime uses DIFFERENT tokens
# (CLOUDFLARE_PROVISIONING_API_TOKEN, CLOUDFLARE_CACHE_API_TOKEN) set
# via `wrangler secret put` — see
# docs/cloudflare-worker-secrets-setup.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deploy target environment (production only — staging is push-driven)'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  ci:
    name: typecheck + test + verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Verify no legacy production references
        run: npm run verify:no-legacy-prod-refs

      - name: Verify infra contract (wrangler.toml names match Phase 1.5 contract)
        run: npm run verify:infra

      - name: Verify worker config ([vars] routing contract per env)
        run: npm run verify:worker-config

  deploy-staging:
    name: Deploy to staging
    needs: ci
    # Deployment is OFF by default. To enable, set the repo variable
    # ENABLE_STAGING_DEPLOY to the literal string 'true'
    # (Settings -> Secrets and variables -> Actions -> Variables).
    # Until that flag is flipped, this job is skipped on every push to
    # main, so a merge to main cannot accidentally deploy.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Apply D1 migrations BEFORE deploy so new schema is in place when the
      # new worker code goes live. Per deploy-safety.md D1-file rule, every
      # migration MUST be applied via CI; without this step, tables added by
      # migration 0008 (ai_generations, media.ai_generation_id) won't exist
      # in the staging D1, and the AI generators will fail at first call.
      - name: Apply D1 migrations (staging)
        run: npx wrangler d1 migrations apply kodigital-homepages-cms-db --env staging --remote

      - name: Deploy to staging
        run: npm run deploy:staging

  deploy-production:
    name: Deploy to production
    needs: ci
    # Production deploy NEVER runs on push or pull_request. It requires
    # an explicit workflow_dispatch trigger from the Actions UI (or
    # `gh workflow run`) AFTER staging smoke has passed. See
    # docs/deployment-runbook.md "Flight — Production".
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.target_env == 'production'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # D1 migrations apply BEFORE the Worker deploy.
      # Per deploy-safety.md D1-file rule, every migration filename in
      # api/migrations/ MUST be grep-anchored in this file so reviewers
      # can confirm every migration is shipped before the Worker that
      # reads its schema is deployed. Ordering invariant: schema lands
      # FIRST, Worker SECOND. Wrangler is idempotent — already-applied
      # migrations are skipped.
      #
      # Tracked migration filenames (per-migration traceability anchor):
      #   - 0001_init_cms.sql
      #   - 0002_phase3_multi_site_schema.sql
      #   - 0003_phase3_site_settings_restructure.sql
      #   - 0004_phase3_seed_verticals_and_legal_templates.sql
      #   - 0005_phase3_fix_missing_indexes.sql
      #   - 0006_phase3r_admin_site_aware_content.sql
      #   - 0007_phase3r_drop_global_slug_unique.sql
      #   - 0008_phase5_ai_generations.sql
      #   - 0009_phase7_content_version_and_indexes.sql
      #   - 0010_phase9_sites_content_mode.sql
      #   - 0011_phase9_prompt_presets_model_columns.sql
      #   - 0012_phase9_pages_admin_crud_columns.sql
      #   - 0013_phase10_media_admin_crud_columns.sql
      #   - 0014_phase9_prompt_presets_reference_columns.sql
      #   - 0016_phase9_seed_default_prompt_presets.sql
      #   - 0017_phase11_articles_author_bio.sql
      #   - 0018_phase11_categories_description_show_on_homepage.sql
      #   - 0019_rescue4_preset_columns.sql
      #   - 0020_rescue4_seed_system_presets.sql
      #   - 0021_rescue4_hero_image_setting.sql
      #   - 0022_rescue4_provisioning_article_units.sql
      #   - 0023_rescue4_content_prompt_quality.sql
      #   - 0024_rescue4_image_prompt_quality.sql
      - name: Apply D1 migrations to production (kodigital-homepages-cms-db)
        run: npx wrangler d1 migrations apply kodigital-homepages-cms-db --env production --remote

      - name: Deploy to production
        run: npm run deploy:production
