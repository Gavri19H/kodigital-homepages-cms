name = "kodigital-homepages-cms-worker"
main = "src/index.ts"
compatibility_date = "2026-05-06"
account_id = "a05d7505b71c6cd931e436defe670509"

# Section 6.2 admin bundles live in ./public. The Worker remains first for all
# routes; only the two manifest-pinned /assets/admin/{conversions,reporting}/*
# paths are explicitly forwarded to this binding by the authenticated router.
[assets]
directory = "./public"
binding = "ADMIN_ASSETS"
run_worker_first = true

# This worker shares the Cloudflare account with the sibling project a2z-cf-cms-v1
# (TheIWise). All bindings below are kodigital-homepages-cms-* placeholders only —
# this Phase 1.5 scaffold MUST NOT bind to or modify any TheIWise resource.
#
# Phase 1.5 hostname routing contract:
#   ADMIN_HOST          — the only public hostname that serves /admin and /api/admin
#   ADMIN_BASE_PATH     — the URL prefix the admin SPA mounts under (always "/admin")
#   ADMIN_BASE_URL      — fully qualified URL used by docs/scripts (scheme + ADMIN_HOST)
# Phase 1.5 site-provisioning safety:
#   SITE_PROVISIONING_DRY_RUN              — when "true", provisioning API logs only, no mutations
#   SITE_PROVISIONING_ALLOW_ROUTE_MUTATION — when "false", Cloudflare route changes are blocked
#   HTML_CACHE_TTL_SECONDS                 — TTL for rendered HTML cached in KV CACHE

[vars]
APP_ENV = "development"
# Analytics pipeline (POST /api/track -> Kinesis Firehose `homepage-events` ->
# S3 -> Athena `homepage.events`). AWS_REGION + the stream name are non-sensitive
# plaintext vars (MUST stay here so CI deploy doesn't wipe them from Dashboard).
# The AWS access key id + secret access key are ENCRYPTED SECRETS (set via
# `wrangler secret put`, Dashboard-only) and MUST NEVER appear in this file.
AWS_REGION = "us-east-1"
EVENTS_FIREHOSE_STREAM = "homepage-events"
# Listicles tracking stream (§16). Same AWS creds/secrets as the homepage
# stream; the worker no-ops until the stream exists in AWS.
LISTICLE_EVENTS_FIREHOSE_STREAM = "listicle-events"
# LeadGen tracking stream (contract 08 §22.1: POST /lg/track → Firehose
# `leadgen-events`). NON-secret stream NAME — belongs in [vars] (the AWS creds
# are wrangler SECRETS, never here). Same reuse posture as the Listicles stream;
# the worker no-ops until the stream exists in AWS.
LEADGEN_EVENTS_FIREHOSE_STREAM = "leadgen-events"
# Section 18.7: exact, non-secret allowlist for database-selected outbound
# credential bindings. The two current production rows are disabled legacy
# S2S names; new offer/provider references must use OFFER_TOKEN_* in code.
LEADGEN_ALLOWED_OUTBOUND_SECRET_REFS = "LEADGEN_S2S_TOKEN_FACEBOOK,LISTICLE_S2S_TOKEN_FACEBOOK"
CONVERSIONS_UI_ENABLED = "false"
# Independent Conversions service proxy gate. Runtime identity/workspace/role/
# capability/account scope is resolved only from the CMS D1 authority. The HMAC
# key is a Wrangler secret named CONVERSIONS_ACTOR_SIGNING_KEY_B64URL and must
# never be added here.
CONVERSIONS_PROXY_ENABLED = "false"
CONVERSIONS_ACTOR_AUDIENCE = "kodigital-conversions-core"
CONVERSIONS_ACTOR_ENVIRONMENT = "development"
# Listicles Phase 9 revenue pipeline (§19/§20/§24) uses ONLY encrypted secrets —
# NONE appear here (they are set via `wrangler secret put`, Dashboard/CI only,
# exactly like the AWS + CH creds). Typed optional in api/src/env.ts; full names
# + set commands in infra/listicles/revenue-secrets.md:
#   LISTICLE_PB_TOKEN_<PROVIDER>   — inbound postback shared secret per provider
#                                    (<PROVIDER> = the uppercased /api/pb/<x> param)
#   LISTICLE_S2S_TOKEN_<PLATFORM>  — outbound S2S token per media platform
#                                    (named by that platform row's auth_secret_ref)
# Absent ⇒ that leg no-ops (postback 401 / S2S skipped), never a hard failure.
ADMIN_HOST = "localhost"
ADMIN_BASE_URL = "http://localhost:8787"
ADMIN_BASE_PATH = "/admin"
CACHE_API_ENABLED = "true"
HTML_CACHE_TTL_SECONDS = "60"
OPENAI_TEXT_MODEL = "gpt-5.5"
OPENAI_IMAGE_MODEL = "gpt-image-2"
SITE_PROVISIONING_DRY_RUN = "true"
SITE_PROVISIONING_ALLOW_ROUTE_MUTATION = "false"

# T42 — Scheduled cron. Fires the Worker `scheduled` handler (src/index.ts)
# every minute; it runs processScheduledArticles (publish due articles) AND
# driveInProgressProvisioning (advance any stalled/in-progress site-creation
# job one bounded budget at a time — the completion guarantee for the chunked,
# O(1)-per-invocation provisioning runner). A 1-minute cadence keeps a fresh
# site moving steadily to 'active' for any article count. Triggers are NOT
# inherited by named environments (same as bindings, below) so
# [env.staging.triggers] / [env.production.triggers] are redeclared per env.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kodigital-homepages-cms-db"
database_id = "caa649b9-128e-4912-97c8-3e3d4a394800"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "77bb281de4fb4008a06b0993eb8b1774"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kodigital-homepages-cms-media"

# Non-secret local service-binding placeholder. It is never contacted while
# CONVERSIONS_PROXY_ENABLED remains false.
[[services]]
binding = "CONVERSIONS_CORE"
service = "kodigital-conversions-core-local"


# rescue-4 v3 — parallel provisioning fan-out. The two heavy gen steps enqueue
# one message per article/image unit; Cloudflare runs the queue() consumer
# across a PARALLEL fleet (one gen per invocation, full speed). max_concurrency
# is the throughput knob — set it to your OpenAI concurrent rate limit and raise
# as your quota grows (config only, no code change). max_batch_size=1 = one gen
# per invocation (no in-invocation contention). Failed msgs retry then DLQ.
# ONE-TIME operator setup before deploy:
#   wrangler queues create kodigital-provisioning
#   wrangler queues create kodigital-provisioning-dlq
[[queues.producers]]
binding = "PROVISION_QUEUE"
queue = "kodigital-provisioning"

[[queues.consumers]]
queue = "kodigital-provisioning"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
max_concurrency = 10
dead_letter_queue = "kodigital-provisioning-dlq"


[observability]
enabled = true
# Log every request while establishing the bot / AI-agent traffic baseline;
# lower this (e.g. 0.1) once the picture is clear to bound Workers Logs volume.
head_sampling_rate = 1

[env.staging]
name = "kodigital-homepages-cms-worker-staging"
services = []
queues = { producers = [], consumers = [] }

[env.staging.vars]
APP_ENV = "staging"
AWS_REGION = "us-east-1"
EVENTS_FIREHOSE_STREAM = "homepage-events"
LISTICLE_EVENTS_FIREHOSE_STREAM = "listicle-events"
LEADGEN_EVENTS_FIREHOSE_STREAM = "leadgen-events"
LEADGEN_ALLOWED_OUTBOUND_SECRET_REFS = "LEADGEN_S2S_TOKEN_FACEBOOK,LISTICLE_S2S_TOKEN_FACEBOOK"
# Staging stays disabled ON PURPOSE: [env.staging] declares `services = []`, so
# there is no CONVERSIONS_CORE service binding here — enabling the proxy would
# point it at nothing. Production (below) mirrors the live deployed "true"/"true".
CONVERSIONS_UI_ENABLED = "false"
CONVERSIONS_PROXY_ENABLED = "false"
CONVERSIONS_ACTOR_AUDIENCE = "kodigital-conversions-core"
CONVERSIONS_ACTOR_ENVIRONMENT = "staging"
ADMIN_HOST = "staging-cms.kodigital.app"
ADMIN_BASE_URL = "https://staging-cms.kodigital.app"
ADMIN_BASE_PATH = "/admin"
CACHE_API_ENABLED = "true"
HTML_CACHE_TTL_SECONDS = "60"
OPENAI_TEXT_MODEL = "gpt-5.5"
OPENAI_IMAGE_MODEL = "gpt-image-2"
SITE_PROVISIONING_DRY_RUN = "true"
SITE_PROVISIONING_ALLOW_ROUTE_MUTATION = "false"
CF_ACCESS_TEAM_DOMAIN = "kodigital2.cloudflareaccess.com"
CF_ACCESS_AUD = "ec9b3610a2b4774ef4ff1eb95e0438b4ec72d9e943971828c5179bfaed7d1a28"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[[env.staging.d1_databases]]
binding = "DB"
database_name = "kodigital-homepages-cms-db"
database_id = "caa649b9-128e-4912-97c8-3e3d4a394800"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "77bb281de4fb4008a06b0993eb8b1774"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "kodigital-homepages-cms-media"

# Preserve the currently deployed staging trigger topology during the disabled
# Conversions seam rollout. Staging has no cron, queue, or Conversions Core
# service target; those capabilities require separate provisioning authority.


[env.production]
name = "kodigital-homepages-cms-worker"

[env.production.vars]
APP_ENV = "production"
AWS_REGION = "us-east-1"
EVENTS_FIREHOSE_STREAM = "homepage-events"
LISTICLE_EVENTS_FIREHOSE_STREAM = "listicle-events"
LEADGEN_EVENTS_FIREHOSE_STREAM = "leadgen-events"
LEADGEN_ALLOWED_OUTBOUND_SECRET_REFS = "LEADGEN_S2S_TOKEN_FACEBOOK,LISTICLE_S2S_TOKEN_FACEBOOK"
# MATCHES LIVE PRODUCTION. A CI deploy OVERWRITES the Dashboard, so these must
# mirror what is actually running or the deploy silently turns the Conversions
# product off. Read off the active production version
# 4f2db4f9-0c6f-469a-9a85-701f78691e9d (100% traffic, deployed 2026-08-01):
#   env.CONVERSIONS_UI_ENABLED ("true") / env.CONVERSIONS_PROXY_ENABLED ("true")
# Staging deliberately keeps both "false": [env.staging] declares `services = []`
# (no CONVERSIONS_CORE service binding exists there), so enabling the proxy on
# staging would point it at nothing.
CONVERSIONS_UI_ENABLED = "true"
CONVERSIONS_PROXY_ENABLED = "true"
CONVERSIONS_ACTOR_AUDIENCE = "kodigital-conversions-core"
CONVERSIONS_ACTOR_ENVIRONMENT = "production"
ADMIN_HOST = "cms.kodigital.app"
ADMIN_BASE_URL = "https://cms.kodigital.app"
ADMIN_BASE_PATH = "/admin"
CACHE_API_ENABLED = "true"
HTML_CACHE_TTL_SECONDS = "300"
OPENAI_TEXT_MODEL = "gpt-5.5"
OPENAI_IMAGE_MODEL = "gpt-image-2"
SITE_PROVISIONING_DRY_RUN = "false"
SITE_PROVISIONING_ALLOW_ROUTE_MUTATION = "true"
# Cloudflare Access auth context. Required by api/src/auth/access-auth.ts
# to fetch JWKS (CF_ACCESS_TEAM_DOMAIN/cdn-cgi/access/certs) and to
# validate the JWT audience claim against the CMS app (CF_ACCESS_AUD).
# Neither value is sensitive: TEAM_DOMAIN is the public team URL and AUD
# is the application ID. Sensitive credentials (CF_ACCESS_CLIENT_SECRET,
# OPENAI_API_KEY, CLOUDFLARE_PROVISIONING_API_TOKEN, etc.) MUST stay in
# wrangler secrets (per docs/cloudflare-worker-secrets-setup.md), never
# in [vars].
CF_ACCESS_TEAM_DOMAIN = "kodigital2.cloudflareaccess.com"
CF_ACCESS_AUD = "ec9b3610a2b4774ef4ff1eb95e0438b4ec72d9e943971828c5179bfaed7d1a28"

# Bindings MUST be redeclared per env. Wrangler does NOT inherit
# [[d1_databases]] / [[kv_namespaces]] / [[r2_buckets]] from the top
# level when an [env.production] block exists. Without these the
# deployed worker has no DB / cache / media access and Phase 3 admin
# routes fail at runtime (the prior deploy emitted 3 wrangler WARNINGs
# and uploaded a binding-less worker; cms.kodigital.app/admin then
# fell through to legacy state until this hotfix).
[env.production.triggers]
crons = ["* * * * *"]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.d1_databases]]
binding = "DB"
database_name = "kodigital-homepages-cms-db"
database_id = "caa649b9-128e-4912-97c8-3e3d4a394800"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "77bb281de4fb4008a06b0993eb8b1774"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "kodigital-homepages-cms-media"

# Non-secret target name only; no deployment, binding provisioning or secret
# mutation is authorized here. TARGET VERIFIED against the account, do not
# "correct" it to the binding name: `wrangler deployments list --name
# kodigital-conversions-core` returns a live 100% deployment, while
# `--name CONVERSIONS_CORE` returns "This Worker does not exist on your
# account. [code: 10007]". The active production version 4f2db4f9 lists this
# binding as `env.CONVERSIONS_CORE (kodigital-conversions-core)` — CONVERSIONS_CORE
# is the BINDING name, kodigital-conversions-core is the SERVICE it points at.
[[env.production.services]]
binding = "CONVERSIONS_CORE"
service = "kodigital-conversions-core"

[[env.production.queues.producers]]
binding = "PROVISION_QUEUE"
queue = "kodigital-provisioning"

[[env.production.queues.consumers]]
queue = "kodigital-provisioning"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
max_concurrency = 10
dead_letter_queue = "kodigital-provisioning-dlq"
